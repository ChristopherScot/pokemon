# Cross-compiles and publishes release assets, named to match what the
# generated `update` command looks for. Triggered by a VERSION change so a
# release is deliberate - but tests run on every push and PR, or a CLI repo
# would only ever be tested at release time.
name: pokedex-tui

on:
  push:
    branches: [main]
    paths: ['services/pokedex-tui/**', '.github/workflows/pokedex-tui.yaml']
  pull_request:
    paths: ['services/pokedex-tui/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Everything below runs in the service directory: in a monorepo the
    # CLI's go.mod is not at the repo root, and `go test ./...` from the
    # root either finds nothing or tests a sibling service.
    defaults:
      run:
        working-directory: services/pokedex-tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/pokedex-tui/go.mod
          cache: true
          cache-dependency-path: services/pokedex-tui/go.sum

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  release:
    # Only when VERSION changed, and only from main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # grep -qx against the full path. A bare `VERSION` never matches
      # in a monorepo, where the file is services/<name>/VERSION - so the
      # gate stayed closed forever and no release could be cut, silently,
      # because a gate that does not open looks the same as a commit that
      # did not bump the version.
      - name: Release only on a VERSION change
        id: gate
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qx 'services/pokedex-tui/VERSION'; then
            echo "go=true" >> $GITHUB_OUTPUT
          else
            echo "go=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.go == 'true'
        with:
          go-version-file: services/pokedex-tui/go.mod
          cache: true
          cache-dependency-path: services/pokedex-tui/go.sum

      - name: Read version
        if: steps.gate.outputs.go == 'true'
        id: v
        run: echo "version=$(head -n1 services/pokedex-tui/VERSION)" >> $GITHUB_OUTPUT

      # Asset names must match what `pokedex-tui update` looks for:
      # pokedex-tui_<goos>_<goarch>.tar.gz containing the bare binary.
      # Version is injected here; without it a released binary reports
      # "dev" and refuses to update itself.
      - name: Cross-compile
        if: steps.gate.outputs.go == 'true'
        working-directory: services/pokedex-tui
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          LDFLAGS="-s -w -X main.Version=$VERSION"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            mkdir -p "dist/$GOOS/$GOARCH"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "dist/$GOOS/$GOARCH/pokedex-tui" .
            tar -czf "pokedex-tui_${GOOS}_${GOARCH}.tar.gz" -C "dist/$GOOS/$GOARCH" "pokedex-tui"
          done
          sha256sum pokedex-tui_*.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v2
        if: steps.gate.outputs.go == 'true'
        with:
          tag_name: ${{ steps.v.outputs.version }}
          files: |
            services/pokedex-tui/pokedex-tui_*.tar.gz
            services/pokedex-tui/checksums.txt
