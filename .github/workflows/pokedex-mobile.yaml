# Builds an APK you can put on a phone, and a desktop binary for each
# platform. Triggered by a VERSION change so a release is deliberate -
# tests run on every push and PR.
#
# Android only. iOS is deliberately absent: an .ipa needs a macOS
# runner, an Apple certificate and a provisioning profile, and without
# a paid developer account the result expires after seven days. That
# is a subscription and a weekly rebuild to install one app on one
# phone, so this scaffolds the half that works.
name: pokedex-mobile

on:
  push:
    branches: [main]
    paths: ['services/pokedex-mobile/**', '.github/workflows/pokedex-mobile.yaml']
  pull_request:
    paths: ['services/pokedex-mobile/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/pokedex-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/pokedex-mobile/go.mod
          cache: true
          cache-dependency-path: services/pokedex-mobile/go.sum

      # Gio links against X11 and Wayland to build for desktop, and the
      # runner has neither. Without these the build fails on a missing
      # C header, which reads like a Go problem and is not.
      - name: Install Gio's desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libgles2-mesa-dev \
            libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      # make test, not the commands themselves: the Makefile says it
      # runs "what CI runs", and that is only true if this IS it. Two
      # copies of the same command drift, and the one that drifts is
      # whichever nobody is looking at.
      - name: Test
        run: make test

      - name: Build
        run: make build

  release:
    # Only when VERSION changed, and only from main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Release only on a VERSION change
        id: gate
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qx 'services/pokedex-mobile/VERSION'; then
            echo "go=true" >> $GITHUB_OUTPUT
          else
            echo "go=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.go == 'true'
        with:
          go-version-file: services/pokedex-mobile/go.mod
          cache: true
          cache-dependency-path: services/pokedex-mobile/go.sum

      # JDK 17, despite Gio's install guide saying to use 8.
      #
      # That advice is stale. Modern build-tools ship a d8 compiled for
      # class file 55, so a JDK 8 runtime cannot load it:
      #
      #   UnsupportedClassVersionError: com/android/tools/r8/D8 has been
      #   compiled by a more recent version of the Java Runtime (class
      #   file version 55.0) ... only recognizes up to 52.0
      #
      # sdkmanager independently refuses anything below 17. And the
      # reason 8 was ever needed does not apply: gogio invokes javac
      # with an explicit "-source 1.8 -target 1.8", so the bytecode it
      # produces is Java 8 whatever JDK compiles it.
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.go == 'true'
        with:
          distribution: temurin
          java-version: "17"

      # The NDK is what cross-compiles the Go code for the phone's CPU;
      # the runner already has platforms and build-tools preinstalled.
      #
      # Pinning versions here is advisory at best: gogio calls
      # latestPlatform and latestTools, so it uses whatever newest is on
      # disk regardless of what this asks for.
      - uses: android-actions/setup-android@v3
        if: steps.gate.outputs.go == 'true'
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Read version
        if: steps.gate.outputs.go == 'true'
        id: v
        run: echo "version=$(head -n1 services/pokedex-mobile/VERSION)" >> $GITHUB_OUTPUT

      # A debug key is enough for a phone to install after allowing
      # unknown sources - no Play Console, no certificate. The cost:
      # Android identifies an app by (app id, signing key) and CI
      # generates a fresh key each run, so upgrading over a previous
      # install is REFUSED and you uninstall first. A keystore in Vault
      # is the upgrade path when this stops being a toy.
      # One command, the same one a person runs. The APK needs a
      # four-part version, a repack because gogio compresses the
      # native libraries, and a re-sign after that - keeping those in
      # the Makefile rather than here means a break shows up locally
      # instead of only on main.
      #
      # The cost of a debug key: Android identifies an app by the pair
      # (app id, signing key), and CI generates a fresh key each run.
      # So an upgrade over a previous install is REFUSED, and the fix
      # is to uninstall first. A real keystore held in Vault removes
      # that, and is the upgrade path when this stops being a toy.
      #
      # gogio wants major.minor.patch.versioncode - FOUR components,
      # not three. The fourth is Android's integer versionCode, which
      # must increase on every release or a phone refuses the upgrade as
      # a downgrade. github.run_number is used for it because it only
      # ever goes up; deriving it from VERSION would mean encoding a
      # fourth number by hand and never being allowed to get it wrong.
      # VERSION_CODE is Android's integer versionCode, which must
      # increase on every release or a phone refuses the upgrade as a
      # downgrade. github.run_number only ever goes up.
      - name: Build the APK
        if: steps.gate.outputs.go == 'true'
        working-directory: services/pokedex-mobile
        run: make build TARGET=apk VERSION_CODE=${{ github.run_number }}

      - name: Checksums
        if: steps.gate.outputs.go == 'true'
        working-directory: services/pokedex-mobile
        run: sha256sum pokedex-mobile.apk > checksums.txt

      - uses: softprops/action-gh-release@v2
        if: steps.gate.outputs.go == 'true'
        with:
          tag_name: ${{ steps.v.outputs.version }}
          files: |
            services/pokedex-mobile/pokedex-mobile.apk
            services/pokedex-mobile/checksums.txt
          body: |
            ## Install on Android

            Download `pokedex-mobile.apk` below and open it on your phone.
            Android will ask permission to install from this source the
            first time.

            **Signed with a throwaway debug key**, which CI regenerates
            on every release. Android refuses to upgrade an app whose
            signing key changed, so uninstall the previous version
            before installing this one.
