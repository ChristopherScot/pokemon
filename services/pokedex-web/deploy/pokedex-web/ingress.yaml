apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pokedex-web
  namespace: pokedex-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: external
  tls:
    - hosts: [pokemon.home.chrisscotmartin.com]
      secretName: pokedex-web-tls
  rules:
    - host: pokemon.home.chrisscotmartin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # KEDA HTTP interceptor (scale-to-zero), not the app's
                # own Service — see scale-to-zero.yaml. 8080 is the
                # interceptor's port; the app still serves 80 behind it.
                name: keda-http-interceptor
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pokedex-web-public
  namespace: pokedex-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: public
  tls:
    - hosts: [pokemon.chrisscotmartin.com]
      secretName: pokedex-web-public-tls
  rules:
    - host: pokemon.chrisscotmartin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # Through the interceptor too — the public host must be
                # able to wake the app, and both hosts are listed on the
                # InterceptorRoute. nginx's limit-rps above still fronts
                # the now-internet-reachable interceptor for this host.
                name: keda-http-interceptor
                port:
                  number: 8080
