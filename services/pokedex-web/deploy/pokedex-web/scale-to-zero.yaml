# Scale-to-zero for pokedex-web via the KEDA HTTP add-on in the homelab
# cluster (pattern home: homelab arr-stack/_shared/keda-http-interceptor.yaml).
# The Ingresses route to the interceptor alias below; the InterceptorRoute
# wakes the Deployment on the first request, serving the waking page
# (503 + Refresh) until it's ready, and the ScaledObject scales it back
# to 0 after the idle cooldown (value on the ScaledObject below).
#
# The pokedex API deliberately does NOT sleep: both frontends call
# http://pokedex.pokedex.svc.cluster.local from code (hardcoded, see
# manifests/networkpolicy.yaml), and a service-direct call to a sleeping
# app gets ECONNREFUSED — nothing ever wakes it. Only workloads reached
# through the interceptor can sleep.
#
# /api traffic on pokemon.home never reaches the interceptor: the
# pokedex ingress's regex path is more specific than this app's `/` and
# nginx routes it straight to the API service.
apiVersion: v1
kind: Service
metadata:
  name: keda-http-interceptor
  namespace: pokedex-web
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pokedex-web-waking-page
  namespace: pokedex-web
  labels:
    # Without this label the interceptor refuses to serve the ConfigMap
    # as a response body.
    http.keda.sh/response-body: "true"
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Pok&eacute;dex</title>
      <style>
        :root { color-scheme: light dark; }
        body {
          margin: 0; min-height: 100vh; display: grid; place-items: center;
          font-family: system-ui, sans-serif;
          background: light-dark(#f2f6f8, #15191d); color: light-dark(#2c3a42, #cfd8dd);
        }
        .card { text-align: center; padding: 2rem; }
        .ball {
          width: 56px; height: 56px; margin: 0 auto; border-radius: 50%;
          border: 4px solid light-dark(#2c3a42, #cfd8dd);
          background: linear-gradient(to bottom, #e3350d 0 46%, light-dark(#2c3a42, #cfd8dd) 46% 54%, #fff 54% 100%);
          position: relative; animation: wobble 1.4s ease-in-out infinite;
        }
        .ball::after {
          content: ""; position: absolute; inset: 0; margin: auto;
          width: 14px; height: 14px; border-radius: 50%;
          background: #fff; border: 4px solid light-dark(#2c3a42, #cfd8dd);
        }
        @keyframes wobble {
          0%, 100% { transform: rotate(-14deg); }
          50% { transform: rotate(14deg); }
        }
        h1 { font-size: 1.3rem; font-weight: 600; margin: 1.1rem 0 0.4rem; }
        p { margin: 0; opacity: 0.7; font-size: 0.95rem; }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="ball"></div>
        <h1>The Pok&eacute;dex is waking up</h1>
        <p>It was asleep to save power. Just a moment &mdash; this page refreshes itself.</p>
      </div>
    </body>
    </html>
---
# Routing + cold-start page. Hosts and paths are coupled to ingress.yaml:
# every host/path an Ingress sends to the interceptor must match a rule
# here, or those requests never wake the app. Both the LAN and public
# hosts are listed; a missed one would sleep forever on that name.
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: pokedex-web
  namespace: pokedex-web
  annotations:
    # Don't block the whole app's sync on a fresh bootstrap, before the
    # keda app has installed its CRDs.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  target:
    service: pokedex-web
    port: 80
  rules:
    - hosts:
        - pokemon.home.chrisscotmartin.com
        - pokemon.chrisscotmartin.com
      paths:
        - value: /
  # requestRate 100 is the add-on's conventional default, made explicit
  # as the API requires. Mostly moot at min 0 / max 1.
  scalingMetric:
    requestRate:
      targetValue: 100
  coldStart:
    placeholder:
      response:
        bodyFromConfigMap:
          name: pokedex-web-waking-page
          key: index.html
        headers:
          Refresh: "5"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pokedex-web
  namespace: pokedex-web
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pokedex-web
  minReplicaCount: 0
  maxReplicaCount: 1
  # Seconds without traffic before scaling back to zero.
  cooldownPeriod: 900
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: pokedex-web
