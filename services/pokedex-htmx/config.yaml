# yaml-language-server: $schema=config.schema.json
# The single source of truth for this service. `homelabctl render`
# regenerates every manifest from it, so change things here rather than
# editing deploy/ by hand.
name: pokedex-htmx
team: me-myself-and-i
runtime: node-service
spec: false
image:
    repository: ghcr.io/christopherscot/pokemon-pokedex-htmx
port: 3000
resources:
    cpuRequest: 10m
    memoryRequest: 96Mi
    memoryLimit: 256Mi
hardened: true
metrics: true

# LAN only. There is deliberately no `public: true` host here: this is a
# port of pokedex-web kept for comparison, not a second front door. The
# name resolves to 192.168.50.225, which only the internal controller
# serves.
ingress:
    hosts:
        - pokedex-htmx.home.chrisscotmartin.com

# One replica, and that is load-bearing rather than incidental.
#
# battle.ts keeps a module-level `seen` map: the per-battle history the
# damage floats are timed from, which cannot be derived from the battle
# alone because the API's log entries carry no timestamp. That state
# lives in the pod. With two replicas, two pollers of the same battle
# reach different pods with different histories, and the floats flicker
# or repeat.
#
# Scaling out needs timestamps on the log events first - a change to the
# API, not to this service. Until then an HPA here would look harmless
# and break the animation.
replicas: 1

# The NetworkPolicy this service owns.
manifests:
  - networkpolicy.yaml

