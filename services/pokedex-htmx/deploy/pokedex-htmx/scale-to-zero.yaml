# Scale-to-zero for pokedex-htmx via the KEDA HTTP add-on in the homelab
# cluster (pattern home: homelab arr-stack/_shared/keda-http-interceptor.yaml).
# The Ingress routes to the interceptor alias below; the InterceptorRoute
# wakes the Deployment on the first request, serving the waking page
# (503 + Refresh) until it's ready, and the ScaledObject scales it back
# to 0 after the idle cooldown (value on the ScaledObject below).
#
# The pokedex API deliberately does NOT sleep — see the comment in
# pokedex-web's scale-to-zero.yaml; the hardcoded service-direct call
# applies here identically.
apiVersion: v1
kind: Service
metadata:
  name: keda-http-interceptor
  namespace: pokedex-htmx
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pokedex-htmx-waking-page
  namespace: pokedex-htmx
  labels:
    # Without this label the interceptor refuses to serve the ConfigMap
    # as a response body.
    http.keda.sh/response-body: "true"
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Pok&eacute;dex (htmx)</title>
      <style>
        :root { color-scheme: light dark; }
        body {
          margin: 0; min-height: 100vh; display: grid; place-items: center;
          font-family: system-ui, sans-serif;
          background: light-dark(#f2f6f8, #15191d); color: light-dark(#2c3a42, #cfd8dd);
        }
        .card { text-align: center; padding: 2rem; }
        .ball {
          width: 56px; height: 56px; margin: 0 auto; border-radius: 50%;
          border: 4px solid light-dark(#2c3a42, #cfd8dd);
          background: linear-gradient(to bottom, #e3350d 0 46%, light-dark(#2c3a42, #cfd8dd) 46% 54%, #fff 54% 100%);
          position: relative; animation: wobble 1.4s ease-in-out infinite;
        }
        .ball::after {
          content: ""; position: absolute; inset: 0; margin: auto;
          width: 14px; height: 14px; border-radius: 50%;
          background: #fff; border: 4px solid light-dark(#2c3a42, #cfd8dd);
        }
        @keyframes wobble {
          0%, 100% { transform: rotate(-14deg); }
          50% { transform: rotate(14deg); }
        }
        h1 { font-size: 1.3rem; font-weight: 600; margin: 1.1rem 0 0.4rem; }
        p { margin: 0; opacity: 0.7; font-size: 0.95rem; }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="ball"></div>
        <h1>The Pok&eacute;dex is waking up</h1>
        <p>It was asleep to save power. Just a moment &mdash; this page refreshes itself.</p>
      </div>
    </body>
    </html>
---
# Routing + cold-start page. The host is coupled to ingress.yaml: a
# renamed host with a stale entry here never wakes.
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: pokedex-htmx
  namespace: pokedex-htmx
  annotations:
    # Don't block the whole app's sync on a fresh bootstrap, before the
    # keda app has installed its CRDs.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  target:
    service: pokedex-htmx
    port: 80
  rules:
    - hosts:
        - pokedex-htmx.home.chrisscotmartin.com
      paths:
        - value: /
  scalingMetric:
    requestRate:
      targetValue: 100
  coldStart:
    placeholder:
      response:
        bodyFromConfigMap:
          name: pokedex-htmx-waking-page
          key: index.html
        headers:
          Refresh: "5"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pokedex-htmx
  namespace: pokedex-htmx
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pokedex-htmx
  minReplicaCount: 0
  maxReplicaCount: 1
  # Seconds without traffic before scaling back to zero.
  cooldownPeriod: 900
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: pokedex-htmx
