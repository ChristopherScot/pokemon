apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pokedex-htmx
  namespace: pokedex-htmx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: external
  tls:
    - hosts: [pokedex-htmx.home.chrisscotmartin.com]
      secretName: pokedex-htmx-tls
  rules:
    - host: pokedex-htmx.home.chrisscotmartin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # KEDA HTTP interceptor (scale-to-zero), not the app's
                # own Service — see scale-to-zero.yaml. 8080 is the
                # interceptor's port; the app still serves 80 behind it.
                name: keda-http-interceptor
                port:
                  number: 8080
