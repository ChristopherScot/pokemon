# yaml-language-server: $schema=config.schema.json
# The single source of truth for this service. `homelabctl render`
# regenerates every manifest from it, so change things here rather than
# editing deploy/ by hand.
name: pokedex
team: me-myself-and-i
runtime: go-service
spec: true
image:
    repository: ghcr.io/christopherscot/pokemon-pokedex
port: 3000
hardened: true
metrics: true

# Shares pokemon.home... with the UI, mounted under /api. The prefix is
# stripped before requests arrive, so this service still serves /pokemon
# and /types unprefixed and does not know where it is mounted.
ingress:
    hosts:
        - pokemon.home.chrisscotmartin.com
    path: /api

# secrets:
#   vaultPath: <name>/config      # one Vault path per service
#   keys: [SOME_TOKEN]

# Two replicas, now that state is in Postgres rather than in the
# process.
#
# This waited on persistence, and the reason is worth keeping: with
# state in a map behind a mutex, a second pod made every request a
# coin flip. register minted a token on pod A and the next command
# hit pod B and was told the token was unknown; a battle opened on A
# 404'd when its opponent joined via B. One replica loses everything
# on a deploy - total, obvious, over in a rollout - where two would
# have lost about half of every operation, continuously, and looked
# like a flaky network rather than missing shared state.
#
# What makes two safe now: trainers and battles are rows, a name is
# claimed by a UNIQUE index rather than a mutex, and a turn is one
# SERIALIZABLE transaction that retries when two players move at
# once. Verified with ten concurrent writers against one battle -
# every write lands.
replicas: 2

# The NetworkPolicy this service owns. Raw Kubernetes, because a
# policy is about the cluster rather than about the service.
manifests:
  - networkpolicy.yaml
  - db.yaml

# DATABASE_URL, from the secret CNPG generates for the cluster above.
#
# A patch rather than `secrets:`, which generates an ExternalSecret
# reading from Vault. This credential is not in Vault: CNPG mints it
# with the cluster and rotates it there, so copying it into Vault
# would create a second copy to go stale.
#
# `uri` is the key CNPG writes a full connection string to - the same
# secret also carries host, port, user and password separately, but
# one env var beats reassembling five.
#
# PORT is repeated here because a patched list REPLACES the generated
# one rather than merging into it - maps merge, sequences do not. Left
# out, the container starts with no PORT and serves on the wrong one.
patches:
  Deployment: |
    spec:
      template:
        spec:
          containers:
            - name: pokedex
              env:
                - name: PORT
                  value: "3000"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: pokedex-db-app
                      key: uri
