# yaml-language-server: $schema=config.schema.json
# The single source of truth for this service. `homelabctl render`
# regenerates every manifest from it, so change things here rather than
# editing deploy/ by hand.
name: pokedex
team: me-myself-and-i
runtime: go-service
spec: true
image:
    repository: ghcr.io/christopherscot/pokemon-pokedex
port: 3000
hardened: true
metrics: true

# Shares pokemon.home... with the UI, mounted under /api. The prefix is
# stripped before requests arrive, so this service still serves /pokemon
# and /types unprefixed and does not know where it is mounted.
ingress:
    hosts:
        - pokemon.home.chrisscotmartin.com
    path: /api

# secrets:
#   vaultPath: <name>/config      # one Vault path per service
#   keys: [SOME_TOKEN]

# One replica, by choice rather than by constraint.
#
# Two are now SAFE - state is in Postgres, a name is claimed by a
# UNIQUE index rather than a mutex, and a turn is one SERIALIZABLE
# transaction that retries when two players move at once, verified
# with ten concurrent writers against one battle. They are just not
# NEEDED. This serves a handful of people on a LAN; a second pod buys
# availability during a rollout and costs a second set of connections
# to a single-instance database.
#
# Raising it is now a one-line change with nothing behind it, which
# is the part that took the work.
#
# Worth keeping, because it is why the database happened: with state
# in a map behind a mutex, a second pod made every request a coin
# flip. register minted a token on pod A and the next command hit pod
# B and was told the token was unknown; a battle opened on A 404'd
# when its opponent joined via B. One replica loses everything on a
# deploy - total, obvious, over in a rollout - where two would have
# lost about half of every operation, continuously, and looked like a
# flaky network rather than missing shared state.
replicas: 1

# The NetworkPolicy this service owns. Raw Kubernetes, because a
# policy is about the cluster rather than about the service.
manifests:
  - networkpolicy.yaml
  - db.yaml
