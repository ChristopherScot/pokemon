# What the pokedex API may talk to, and who may talk to it.
#
# NetworkPolicy is enforced here - verified by applying a deny-all
# egress to a scratch namespace and watching curl fail to resolve - so
# this is real containment rather than decoration.
#
# The API is reachable from the internet through pokedex-web once
# pokemon.chrisscotmartin.com is live. Its blast radius was already
# small: no secrets mounted, no Kubernetes API permissions, distroless
# with no shell. This closes the remaining gap, which is a compromised
# process using the cluster network as a map.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pokedex
spec:
  podSelector:
    matchLabels:
      app: pokedex
  policyTypes: [Ingress, Egress]
  ingress:
    # Both ingress controllers, because the API answers on /api of a
    # host that may be LAN or public, and both front ends, which are its
    # only in-cluster callers.
    #
    # A caller missing from this list does not fail in a way that points
    # here: it gets ECONNREFUSED from the Service IP, and the front end
    # reports "pokedex API unavailable", which reads like the API is
    # down. pokedex-htmx deployed green, healthy and 502ing for exactly
    # that reason.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx-public
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pokedex-web
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pokedex-htmx
      ports:
        - protocol: TCP
          port: 3000
    # Prometheus scrapes /metrics on the same port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS, and Postgres. The API used to call nothing at all - state
    # lived in memory - and this rule said so. State moved to
    # pokedex-db, so this is that change.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The CNPG cluster in this namespace. Selected by CNPG's own label
    # rather than by name: a cluster is several pods - primary, any
    # replicas, and whichever is promoted on failover - and they all
    # carry it.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: pokedex-db
      ports:
        - protocol: TCP
          port: 5432
