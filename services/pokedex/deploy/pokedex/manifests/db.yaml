# Postgres for the pokedex: game state that has to survive a restart,
# and the reference data the API serves.
#
# One instance. The data here is reconstructible - reference data from
# pokedex.json, game state that is swept after an hour - so paying for
# a standby to protect it is the wrong trade. A failover takes the
# service down with it either way until the Deployment reconnects.
#
# CNPG generates a `pokedex-db-app` secret in this namespace holding
# the connection details; the Deployment reads it through config.yaml's
# secrets block.
#
# PRUNED WITH THE APP, deliberately. The generated Application syncs
# with prune: true and nothing here opts out, so removing this file
# from `manifests:` deletes the Cluster and its PVC.
#
# That is the accepted trade: this database holds nothing that cannot
# be rebuilt - reference data re-seeds from pokedex.json, and game
# state is swept after an hour - so keeping the manifest and the
# cluster in step is worth more than a Prune=false that hides drift.
# Deleting a database manifest is a deliberate act either way.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pokedex-db
spec:
  instances: 1

  # Both of these are 0 by default, which means "no limit".
  #
  # Without statement_timeout a stuck query runs forever and holds
  # back autovacuum; without the idle-in-transaction timeout a
  # connection that dies mid-transaction during a failover leaves the
  # server side holding locks indefinitely. Verified absent on the
  # live cluster before setting them.
  #
  # 10s is enormously generous for this workload: the turn path is a
  # single-row read and a single-row update. Migrations set their own
  # timeout, so a future backfill is not bound by this.
  postgresql:
    parameters:
      statement_timeout: "10s"
      idle_in_transaction_session_timeout: "30s"
  monitoring:
    enablePodMonitor: true
  storage:
    # The reference data is about 500KB and the game state is smaller
    # still - battles are swept after an hour. 2Gi is the smallest
    # size worth provisioning, not a considered estimate.
    size: 2Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: pokedex
      owner: pokedex

  # Continuous backup to S3, same bucket as every other cluster here.
  #
  # The credential is per service and scoped to this prefix: the IAM
  # user behind it can read and write s3://.../pokedex/* and nothing
  # else, so a compromise here cannot reach another database's
  # backups. Vault rotates its key every 24h and ESO syncs it into
  # pokedex-db-backup-s3.
  backup:
    barmanObjectStore:
      destinationPath: "s3://cscot-homelab-pg-backups/pokedex"
      s3Credentials:
        accessKeyId:
          name: pokedex-db-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: pokedex-db-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
    retentionPolicy: "30d"
---
# The thing that actually runs a backup.
#
# barmanObjectStore above only says WHERE backups go; without this,
# nothing ever triggers one. The cluster sat configured-but-never-
# backed-up until Grafana's "last backup is >36h old" alert caught it,
# which is exactly the failure that alert exists for.
#
# 05:15, after monitoring's 05:00 and shlink's 04:45, so no two
# clusters push to S3 at once. CNPG uses 6-field cron: sec min hour
# dom mon dow.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pokedex-db-daily
spec:
  schedule: "0 15 5 * * *"
  backupOwnerReference: self
  cluster:
    name: pokedex-db
