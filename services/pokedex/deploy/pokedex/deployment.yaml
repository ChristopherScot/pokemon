apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokedex
  namespace: pokedex
  labels:
    app: pokedex
    team: me-myself-and-i
spec:
  replicas: 2
  # At one replica the default rolling update takes the only pod down
  # first; surging instead keeps the service up across a deploy.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: pokedex
  template:
    metadata:
      annotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.path: "/metrics"
        k8s.grafana.com/metrics.portNumber: "3000"
      labels:
        app: pokedex
        team: me-myself-and-i
    spec:
      # Required by the restricted Pod Security Standard, and the cheapest
      # hardening available.
      # Longer than the server's 20s drain so shutdown finishes before
      # SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pokedex
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pokedex-db-app
                  key: uri
      volumes:
        - name: tmp
          emptyDir: {}
