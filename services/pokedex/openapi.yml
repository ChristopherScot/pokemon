# The API contract. This file is the source of truth: `go generate`
# turns it into the server interface, request/response types, validation
# and a typed client, and the compiler then refuses to build until the
# handlers match. Change the API here, not in Go.
openapi: 3.0.3
info:
  title: pokedex
  # Bump this when the API changes. The generated client reports it in
  # Client-Version, so one version covers the API and its clients.
  version: 0.8.0
  description: pokedex, owned by me-myself-and-i.

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness and readiness probe.
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /:
    get:
      operationId: getRoot
      summary: Identify the service and the running build.
      responses:
        '200':
          description: Service identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pokemon:
    get:
      operationId: listPokemon
      summary: List Pokemon, optionally filtered by type.
      parameters:
        - name: type
          in: query
          required: false
          description: Filter to Pokemon having this type, e.g. "fire".
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: The matching Pokemon, in Pokedex order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PokemonList'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pokemon/{name}:
    get:
      operationId: getPokemon
      summary: One Pokemon by name.
      parameters:
        - name: name
          in: path
          required: true
          description: Lowercase name, e.g. "pikachu".
          schema:
            type: string
      responses:
        '200':
          description: The Pokemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pokemon'
        '404':
          description: No Pokemon by that name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pokemon/{name}/moves:
    get:
      operationId: listPokemonMoves
      summary: Every move this Pokemon can learn.
      description: >-
        The full learnable set, which runs to 86 moves for Bulbasaur and
        167 for Mewtwo. This is why it is its own endpoint: putting it on
        the Pokemon object would dominate every list response. The six a
        Pokemon brings to a battle are on the Pokemon itself.
      parameters:
        - name: name
          in: path
          required: true
          description: Lowercase name, e.g. "pikachu".
          schema:
            type: string
      responses:
        '200':
          description: The moves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveList'
        '404':
          description: No Pokemon by that name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /moves:
    get:
      operationId: listMoves
      summary: Every move in the Pokedex.
      responses:
        '200':
          description: The moves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveList'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /moves/{name}:
    get:
      operationId: getMove
      summary: One move by name.
      parameters:
        - name: name
          in: path
          required: true
          description: Lowercase, hyphenated name, e.g. "vine-whip".
          schema:
            type: string
      responses:
        '200':
          description: The move.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Move'
        '404':
          description: No move by that name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /types:
    get:
      operationId: listTypes
      summary: Every type present in the Pokedex, with a count.
      responses:
        '200':
          description: The types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypeList'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------- battles
  #
  # Battles are server-authoritative: damage, turn order, legality and the
  # win condition are decided here. Clients post intents and render what
  # comes back. Three client implementations agreeing on a damage formula
  # is three chances to disagree, and a disagreement looks like cheating.
  #
  # Clients poll GET /battles/{id} and compare `version`, which increases
  # on every change. Websockets would need hand-written transport in each
  # client and an ingress that negotiates upgrades; polling is what the
  # generated client already does well.

  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe. Checks the database.
      responses:
        '200':
          description: The service can reach its database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trainers:
    post:
      operationId: registerTrainer
      summary: Claim a trainer name and receive a token.
      description: >
        The token authorises this trainer's moves; the name is public.
        This is not authentication - it stops one player moving another
        player's Pokemon, nothing more. Names are first-come, and a name
        already in use is a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTrainer'
      responses:
        '201':
          description: Registered. Keep the token; it is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trainer'
        '409':
          description: That name is taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /trainers/waiting:
    get:
      operationId: listWaitingTrainers
      summary: Trainers who have an open battle invitation.
      description: >
        The matchmaking lobby. A trainer appears here after creating a
        battle and disappears when someone joins it or it expires.
      responses:
        '200':
          description: Open invitations, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitingList'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /battles:
    post:
      operationId: createBattle
      summary: Open a battle and wait for an opponent.
      description: >
        Names three Pokemon. The battle sits in `waiting` until another
        trainer joins, which is when turn order is decided.
      parameters:
        - $ref: '#/components/parameters/TrainerToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBattle'
      responses:
        '201':
          description: Battle open, waiting for an opponent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Battle'
        '400':
          description: Not three known Pokemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unknown or missing trainer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /battles/{id}:
    get:
      operationId: getBattle
      summary: The full state of one battle.
      description: >
        Poll this. `version` increases on every change, so a client that
        has seen a version can skip re-rendering until it moves.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Battle'
        '404':
          description: No such battle, or it expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /battles/{id}/join:
    post:
      operationId: joinBattle
      summary: Join a waiting battle with your own three Pokemon.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/TrainerToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinBattle'
      responses:
        '200':
          description: Joined. The battle is now active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Battle'
        '400':
          description: Not three known Pokemon.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unknown or missing trainer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such battle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already full, or you are already in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /battles/{id}/turn:
    post:
      operationId: takeTurn
      summary: Attack with one of your Pokemon.
      description: >
        Names the attacker, the move and the target. The server decides
        damage and whether the battle is over. Out-of-turn moves, fainted
        attackers and illegal targets are 409s rather than silent no-ops,
        so a client bug is visible instead of looking like lag.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/TrainerToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeTurn'
      responses:
        '200':
          description: The turn resolved; state reflects it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Battle'
        '401':
          description: Unknown or missing trainer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such battle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Not your turn, or the move is not legal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    TrainerToken:
      name: X-Trainer-Token
      in: header
      required: true
      description: >
        The token returned by POST /trainers. Identifies who is acting,
        so one player cannot move another player's Pokemon.
      schema:
        type: string

  schemas:
    RegisterTrainer:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          description: Displayed to other trainers in the lobby.

    Trainer:
      type: object
      required: [name, token]
      properties:
        name:
          type: string
        token:
          type: string
          description: >
            Send as X-Trainer-Token. Returned once, at registration.

    WaitingList:
      type: object
      required: [count, waiting]
      properties:
        count:
          type: integer
        waiting:
          type: array
          items:
            $ref: '#/components/schemas/WaitingBattle'

    WaitingBattle:
      type: object
      required: [battleId, trainer, team, createdAt]
      properties:
        battleId:
          type: string
        trainer:
          type: string
        team:
          type: array
          description: Who they are bringing, so you can pick a counter.
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    CreateBattle:
      type: object
      properties:
        team:
          type: array
          maxItems: 3
          items:
            type: string
          description: >
            Up to three Pokemon names. Anything you leave out is chosen
            at random, so a client can offer "pick the ones you care
            about" rather than all-or-nothing - and omitting the field
            entirely is a full random team, which makes "just start a
            battle" one click.

    JoinBattle:
      type: object
      properties:
        team:
          type: array
          maxItems: 3
          items:
            type: string
          description: >
            Up to three Pokemon names; anything left out is random.

    TakeTurn:
      type: object
      required: [attacker, move, target]
      properties:
        attacker:
          type: integer
          description: Index into your own team, 0-2.
        move:
          type: integer
          description: Index into that Pokemon's moves.
        target:
          type: integer
          description: Index into the opponent's team, 0-2.

    Battle:
      type: object
      required: [id, status, version, sides, log]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [waiting, active, finished]
        version:
          type: integer
          description: >
            Increases on every change. A client that has rendered version
            N can skip re-rendering until it sees something higher, which
            is what makes polling cheap.
        turn:
          type: string
          description: >
            Name of the trainer whose turn it is. Absent while waiting
            and once finished.
        winner:
          type: string
          description: Set when status is finished. Absent on a draw.
        sides:
          type: array
          description: Always two once active; one while waiting.
          items:
            $ref: '#/components/schemas/Side'
        log:
          type: array
          description: >
            What happened, oldest first. Clients animate from this rather
            than recomputing events from state diffs.
          items:
            $ref: '#/components/schemas/BattleEvent'

    Side:
      type: object
      required: [trainer, team]
      properties:
        trainer:
          type: string
        team:
          type: array
          items:
            $ref: '#/components/schemas/BattlePokemon'

    StatStages:
      type: object
      description: >
        Stat changes accumulated this battle, -6 to +6. Zero everywhere
        is the normal state, so a client can skip drawing any of it
        until something moves.
      properties:
        attack:
          type: integer
        defense:
          type: integer
        speed:
          type: integer
        accuracy:
          type: integer

    BattlePokemon:
      type: object
      required: [name, types, hp, maxHp, fainted, moves, sprite]
      properties:
        name:
          type: string
        types:
          type: array
          items:
            type: string
        hp:
          type: integer
        maxHp:
          type: integer
        fainted:
          type: boolean
        sprite:
          type: string
        moves:
          type: array
          items:
            $ref: '#/components/schemas/Move'
        stages:
          $ref: '#/components/schemas/StatStages'
        confused:
          type: boolean
          description: >
            A confused Pokemon can hit itself instead of attacking, so a
            client should say so before the player commits a turn.
        disabledMove:
          type: integer
          description: >
            Index of a move this Pokemon cannot currently use, or absent.
            Prefer usableMoves: this is the input the server used, and a
            client that reads it is re-deriving a conclusion the server
            has already drawn.
        canAct:
          type: boolean
          description: >
            Whether this Pokemon can be chosen as the attacker right
            now. The server decides; a client that computes it from
            fainted, status and whose turn it is has a second copy of
            the rules that will drift.
        canBeTargeted:
          type: boolean
          description: >
            Whether this Pokemon is a legal target right now.
        usableMoves:
          type: array
          items:
            type: boolean
          description: >
            One entry per move, in the same order, saying whether it can
            be selected this turn. Disabled moves and moves with no PP
            are false. A client greys out the false ones and needs no
            rules of its own to do it.

    BattleEvent:
      type: object
      required: [turnNumber, text]
      properties:
        turnNumber:
          type: integer
        text:
          type: string
          description: >
            Pre-rendered prose, so three clients narrate a battle
            identically instead of each inventing wording.
        attacker:
          type: string
        target:
          type: string
        move:
          type: string
        damage:
          type: integer
        effectiveness:
          type: number
          description: >
            Type multiplier applied, e.g. 2 for super effective. Clients
            use it to colour or animate the hit.
        fainted:
          type: boolean


    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Identity:
      type: object
      required: [service, version]
      properties:
        service:
          type: string
        version:
          type: string

    Pokemon:
      type: object
      required: [id, name, types, height, weight, sprite, moves, description, genus]
      properties:
        id:
          type: integer
          description: National Pokedex number.
        name:
          type: string
        description:
          type: string
          description: >-
            The Pokedex entry, from the most recent game that has one.
            Flattened to a single line; the games break it for their own
            text box.
        genus:
          type: string
          description: The one-line label the games give it, e.g. "Seed Pokemon".
        habitat:
          type: string
          description: >-
            Where it is found, e.g. "grassland". Empty for species the
            games never placed.
        types:
          type: array
          items:
            type: string
          description: One or two types, e.g. ["grass", "poison"].
        height:
          type: integer
          description: Decimetres, as the upstream Pokedex reports it.
        weight:
          type: integer
          description: Hectograms, as the upstream Pokedex reports it.
        sprite:
          type: string
          description: Absolute URL to the front-facing sprite.
        artwork:
          type: string
          description: >-
            Absolute URL to the official artwork, which is several
            hundred pixels where sprite is 96.
        evolvesFrom:
          type: string
          description: Name of the Pokemon this evolves from; empty if it is a base form.
        legendary:
          type: boolean
          description: True for legendary and mythical Pokemon.
        moves:
          type: array
          items:
            $ref: '#/components/schemas/Move'
          description: >-
            The moves this Pokemon brings to a battle. Not everything it
            could learn - see GET /pokemon/{name}/moves for that.

    Move:
      type: object
      required: [name, type, power, description, effect, pp, damageClass]
      properties:
        name:
          type: string
        type:
          type: string
        power:
          type: integer
          description: Base power; 0 for status moves that deal no damage.
        description:
          type: string
          description: >-
            How the move looks, in the games' own words. Flattened to a
            single line.
        effect:
          type: string
          description: >-
            What the move does mechanically, where description says how
            it looks.
        accuracy:
          type: integer
          description: >-
            Percent chance to hit. Omitted for moves that cannot miss,
            which is not the same as 100.
        pp:
          type: integer
          description: How many times it can be used.
        damageClass:
          type: string
          description: >-
            "physical", "special" or "status". Physical moves read
            attack and defense, special ones the special stats, and
            status moves deal no damage.

    MoveList:
      type: object
      required: [count, moves]
      properties:
        count:
          type: integer
        moves:
          type: array
          items:
            $ref: '#/components/schemas/Move'

    PokemonList:
      type: object
      required: [count, pokemon]
      properties:
        count:
          type: integer
        pokemon:
          type: array
          items:
            $ref: '#/components/schemas/Pokemon'

    TypeSummary:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
        strongAgainst:
          type: array
          description: >
            Types this one deals double damage to. Served here so the
            clients do not each carry a copy of the chart the server
            computes damage from - three copies is three chances to
            disagree with the server, and the server is what decides.
          items:
            type: string
        weakAgainst:
          type: array
          description: Types this one deals half damage to.
          items:
            type: string
        noEffectAgainst:
          type: array
          description: Types this one cannot damage at all.
          items:
            type: string

    TypeList:
      type: object
      required: [types]
      properties:
        types:
          type: array
          items:
            $ref: '#/components/schemas/TypeSummary'

    # Declaring a `default` response with this shape is what lets ogen
    # generate convenient errors: a handler can return a plain error and
    # the generated code renders it, instead of every operation needing
    # its own error union.
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
